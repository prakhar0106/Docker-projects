version: "3.8"

services:
  
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    networks:
      - two-tier
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "devops"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  flask:
    image: heyyprakhar1/two-tier-backend:latest
    container_name: two-tier-flask
    ports:
      - "5000:5000"
    environment:
      MYSQL_USER: root
      MYSQL_DB: devops
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: root
    networks:
      - two-tier
    depends_on: 
      - mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
networks:
  two-tier: 
